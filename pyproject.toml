[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cue-channels"
version = "0.1.0"
description = "Pre-CoT answer decoding on Qwen 2.5 1.5B: is the answer readable before the chain of thought, and is it used?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # exact versions used for every committed result: requirements.txt / requirements-lock.txt
    "torch>=2.14",
    "transformers>=5.19",
    "accelerate",
    "numpy",
    "scipy",
    "scikit-learn>=1.9",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
writeup = ["python-docx"]
sagemaker = ["sagemaker", "boto3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: downloads model weights or runs inference"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
